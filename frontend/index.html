<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Study Planner</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Study Planner</h1>
        <p class="subtitle">Manage tasks and generate a day-wise plan</p>
      </header>

      <section class="card">
        <h2>Add Task</h2>
        <form id="taskForm">
          <div class="grid">
            <label>
              Subject
              <input name="subject" required placeholder="Math" />
            </label>
            <label>
              Deadline
              <input name="deadline" type="date" required />
            </label>
          </div>

          <label>
            Task description
            <input name="description" required placeholder="Algebra practice" />
          </label>

          <div class="grid">
            <label>
              Priority
              <select name="priority" required>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
              </select>
            </label>

            <label>
              Estimated hours
              <input name="estimated_hours" type="number" step="0.5" min="0" required value="2" />
            </label>
          </div>

          <div class="row">
            <button class="primary" type="submit">Add Task</button>
            <button class="danger" type="button" id="clearBtn">Clear Tasks</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="row space-between">
          <h2>Saved Tasks</h2>
          <button class="primary" type="button" id="generateBtn">Generate Plan</button>
        </div>
        <div id="tasks">Loading...</div>
      </section>

      <section class="card">
        <h2>Plan</h2>
        <div id="status" class="muted"></div>
        <pre id="plan" class="plan"> </pre>
      </section>

      <footer class="muted">
        If OPENAI_API_KEY is not set, the app will use the built-in heuristic schedule.
      </footer>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
